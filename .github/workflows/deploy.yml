name: Deploy SAA learning app
on:
  push:
    branches: [main]
    paths: ['materials/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: materials
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Resolve the store inside materials so pnpm-workspace.yaml is respected.
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-11-${{ hashFiles('materials/pnpm-lock.yaml', 'materials/pnpm-workspace.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm knowledge:check
      - run: pnpm build
      # The Azure HTTP mirror can stall apt even when the official HTTPS mirror works.
      - name: Use the official Ubuntu HTTPS package mirror
        run: printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
      - name: Install WebKit for Safari regression tests
        timeout-minutes: 7
        run: |
          set +e
          timeout 360s pnpm exec playwright install --with-deps webkit > /tmp/webkit-install.log 2>&1
          result=$?
          tail -100 /tmp/webkit-install.log
          if [ "$result" -ne 0 ]; then
            node --input-type=module -e "import {readFileSync} from 'node:fs'; const log=readFileSync('/tmp/webkit-install.log','utf8').slice(-12000); console.log('::error::WebKit installation failed or timed out: '+log.replaceAll('%','%25').replaceAll('\\n','%0A').replaceAll('\\r','%0D'));"
          fi
          exit "$result"
      - name: Verify SVG icon coverage and layouts in Safari
        run: |
          node scripts/icons-browser-check.mjs
          node scripts/icons-audit.mjs
        env:
          BROWSER: webkit
      - name: Verify AWS architecture build research in Safari
        run: |
          python scripts/export-aws-build-design.py --check
          node scripts/aws-builds-browser-check.mjs
        env:
          BROWSER: webkit
      - name: Verify character build design document in Safari
        run: node scripts/character-builds-browser-check.mjs
        env:
          BROWSER: webkit
      - name: Verify role effect design document in Safari
        run: |
          node scripts/role-effects-browser-check.mjs
          node scripts/role-combinations-browser-check.mjs
        env:
          BROWSER: webkit
      - name: Verify touch controls and Safari startup
        run: >-
          node --input-type=module -e
          "try { await import('./scripts/touch-browser-check.mjs'); }
          catch (error) { console.log('::error::' + String(error.stack).replaceAll('%', '%25').replaceAll('\n', '%0A').replaceAll('\r', '%0D')); process.exitCode = 1; }"
        env:
          BROWSER: webkit
      - name: Verify learning catalogue updates in Safari
        run: >-
          node --input-type=module -e
          "try { await import('./scripts/catalog-browser-check.mjs'); }
          catch (error) { console.log('::error::' + String(error.stack).replaceAll('%', '%25').replaceAll('\n', '%0A').replaceAll('\r', '%0D')); process.exitCode = 1; }"
        env:
          BROWSER: webkit
      - name: Verify chapter and exam flows in Safari
        run: node scripts/readiness-browser-check.mjs
        env:
          BROWSER: webkit
      - name: Verify game learning room in Safari
        run: node scripts/study-browser-check.mjs
        env:
          BROWSER: webkit
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: materials/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages-artifact
      - name: Verify the published learning release
        timeout-minutes: 8
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir published-artifact
          tar -xf pages-artifact/artifact.tar -C published-artifact
          python materials/scripts/verify-publication.py published-artifact "$PAGE_URL"
