name: Deploy SAA learning app
on:
  push:
    branches: [main]
    paths: ['materials/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: materials
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # Resolve the store inside materials so pnpm-workspace.yaml is respected.
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-11-${{ hashFiles('materials/pnpm-lock.yaml', 'materials/pnpm-workspace.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm knowledge:check
      - run: pnpm build
      # The Azure HTTP mirror can stall apt even when the official HTTPS mirror works.
      - name: Use the official Ubuntu HTTPS package mirror
        run: printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
      - name: Install WebKit for Safari regression tests
        timeout-minutes: 7
        run: |
          set +e
          timeout 360s pnpm exec playwright install --with-deps webkit > /tmp/webkit-install.log 2>&1
          result=$?
          tail -100 /tmp/webkit-install.log
          if [ "$result" -ne 0 ]; then
            node --input-type=module -e "import {readFileSync} from 'node:fs'; const log=readFileSync('/tmp/webkit-install.log','utf8').slice(-12000); console.log('::error::WebKit installation failed or timed out: '+log.replaceAll('%','%25').replaceAll('\\n','%0A').replaceAll('\\r','%0D'));"
          fi
          exit "$result"
      - name: Verify SVG icon coverage and layouts in Safari
        run: |
          node scripts/icons-browser-check.mjs
          node scripts/icons-audit.mjs
        env:
          BROWSER: webkit
      - name: Verify AWS architecture build research in Safari
        run: |
          python scripts/export-aws-build-design.py --check
          node scripts/aws-builds-browser-check.mjs
        env:
          BROWSER: webkit
      - name: Verify STS-style card effect proposals in Safari
        run: node scripts/card-effects-proposal-browser-check.mjs
        env:
          BROWSER: webkit
      - name: Verify independent card balance pilot in Safari
        run: node scripts/build-lab-browser-check.mjs
        env:
          BROWSER: webkit
      - name: Verify revision 3 adventure in Safari
        run: |
          node scripts/export-build-adventure.mjs --check
          node --input-type=module -e "try { await import('./scripts/build-adventure-browser-check.mjs'); await import('./scripts/cylinder-browser-check.mjs'); } catch (error) { console.log('::error::' + String(error.stack).replaceAll('%', '%25').replaceAll('\\n', '%0A').replaceAll('\\r', '%0D')); process.exitCode = 1; }"
        env:
          BROWSER: webkit
      - name: Verify card build allocation in Safari
        run: pnpm exec tsx scripts/card-build-allocation-browser-check.mjs
        env:
          BROWSER: webkit
      - name: Verify character build design document in Safari
        run: node scripts/character-builds-browser-check.mjs
        env:
          BROWSER: webkit
      - name: Verify role effect design document in Safari
        run: |
          node scripts/role-effects-browser-check.mjs
          node scripts/role-combinations-browser-check.mjs
        env:
          BROWSER: webkit
      - name: Verify touch controls and Safari startup
        run: >-
          node --input-type=module -e
          "try { await import('./scripts/touch-browser-check.mjs'); }
          catch (error) { console.log('::error::' + String(error.stack).replaceAll('%', '%25').replaceAll('\n', '%0A').replaceAll('\r', '%0D')); process.exitCode = 1; }"
        env:
          BROWSER: webkit
      - name: Verify learning catalogue updates in Safari
        run: >-
          node --input-type=module -e
          "try { await import('./scripts/catalog-browser-check.mjs'); }
          catch (error) { console.log('::error::' + String(error.stack).replaceAll('%', '%25').replaceAll('\n', '%0A').replaceAll('\r', '%0D')); process.exitCode = 1; }"
        env:
          BROWSER: webkit
      - name: Verify chapter and exam flows in Safari
        run: node scripts/readiness-browser-check.mjs
        env:
          BROWSER: webkit
      - name: Verify game learning room in Safari
        run: node scripts/study-browser-check.mjs
        env:
          BROWSER: webkit
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: materials/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages
          path: pages-artifact
      - name: Verify the published learning release
        timeout-minutes: 8
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir published-artifact
          tar -xf pages-artifact/artifact.tar -C published-artifact
          python materials/scripts/verify-publication.py published-artifact "$PAGE_URL"
