<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0d151f"><title>クラウドの尖塔 — タップとスワイプで遊ぶ</title><link rel="stylesheet" href="./style.css"></head><body>
<section id="startup">
<h1>クラウドの尖塔</h1><p>ゲームを準備しています…</p>
<div id="startup-error" hidden role="alert"><p>ゲームを開始できませんでした。オンラインで再読み込みしてください。以前の画面が続く場合は、学習ホームの「設定 → 更新を確認・適用」をお試しください。冒険の記録は消去しません。</p><button onclick="location.reload()">再読み込み</button><a href="../index.html">学習ホームを開く</a><p id="startup-detail"></p></div>
</section>
<script>
window.__towerStarted=false;
window.__towerBootFailure=function(message){if(window.__towerStarted)return;document.getElementById('startup-error').hidden=false;document.getElementById('startup-detail').textContent=message||'JavaScriptの読み込みを確認できませんでした。';};
window.addEventListener('error',function(e){window.__towerBootFailure(e.message);});
window.addEventListener('unhandledrejection',function(e){window.__towerBootFailure(String(e.reason&&e.reason.message||e.reason));});
setTimeout(function(){if(!window.__towerStarted)window.__towerBootFailure('読み込みが完了しませんでした。');},8000);
</script><main id="game"></main><noscript>SafariのJavaScriptを有効にしてください。<a href="../index.html">学習ホームへ</a></noscript><script type="module" src="./app.mjs"></script></body></html>
